version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    restart: always

  frontend:
    build: .
    ports:
      - "5173:5173"
    depends_on:
      - backend
    # Монтируем папку, чтобы изменения в коде работали сразу (Hot Reload)
    volumes:
      - ./src:/app/src
    environment:
      - CHOKIDAR_USEPOLLING=true